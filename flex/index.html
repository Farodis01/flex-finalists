<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex.io/zakovat</title>
<style>
:root{--bg:#070b24;--card:#0e1538;--line:#222c63;--tx:#e9ecff;--mut:#8a93c8;--a:#00e0ff;--b:#8b5cf6;--g:#ffc857;--err:#ff6b81;--ok:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--tx);background:var(--bg);
background-image:radial-gradient(circle at 20% 0%,rgba(139,92,246,.25),transparent 40%),radial-gradient(circle at 90% 100%,rgba(0,224,255,.18),transparent 40%),radial-gradient(rgba(120,140,255,.18) 1px,transparent 1px);
background-size:auto,auto,22px 22px;background-attachment:fixed}
.wrap{max-width:920px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px}
.logo span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;font-weight:700;color:#06102b;background:linear-gradient(90deg,var(--a),var(--b));transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,224,255,.3)}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.ghost:hover{box-shadow:none;border-color:var(--a)}
button.sm{padding:8px 12px;font-size:13px}
.hero{text-align:center;padding:80px 10px 60px}
.hero h1{font-size:clamp(36px,8vw,68px);margin:0 0 14px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,var(--a),var(--b),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:520px;margin:0 auto 30px}
.card{background:rgba(14,21,56,.88);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
input,textarea,select{width:100%;background:#080d2b;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx);font:inherit;margin:6px 0 14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a);border-color:transparent}
label{font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(2,4,18,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modal .card{width:100%;max-width:380px;margin:0}
.err{color:var(--err);font-size:14px;min-height:20px;margin-bottom:8px}
.code{font-weight:800;letter-spacing:4px;color:var(--g)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#0a1030}
.item.sel{border-color:var(--a)}
.item small{color:var(--mut)}
.hide{display:none}
#join{text-align:center;padding:30px 0 50px}
#join .card{max-width:480px;margin:0 auto}
#join input{text-align:center;font-size:24px;letter-spacing:6px;text-transform:uppercase}
.qbox{text-align:center;padding:10px}
.qbox .n{color:var(--a);font-weight:700}
.qbox .t{font-size:clamp(20px,4vw,30px);margin:14px 0;line-height:1.35}
.qbox .ans{font-size:22px;color:var(--ok);font-weight:700;min-height:30px}
.timer{font-size:44px;font-weight:800;color:var(--g)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#0a1030}
.team .nm{font-weight:700;margin-bottom:4px}
.team .sc{font-size:46px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.team .row{justify-content:center}
.minus{background:linear-gradient(90deg,#ff6b81,#ff9f6b)}
.plus{background:linear-gradient(90deg,#3ddc97,#00e0ff)}
.team button{padding:8px 18px;font-size:20px}
.team input,.team textarea{margin:4px 0 6px;font-size:14px;padding:8px;text-align:center}
.team input{font-weight:700;font-size:16px;letter-spacing:0;text-transform:none}
.team textarea{text-align:left;resize:vertical;margin-top:10px;margin-bottom:0}
 
/* ---- A/B/C/D test ---- */
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:6px;color:#06102b;background:var(--g)}
.tag.t{background:var(--a)}
.qopts{display:grid;gap:10px;max-width:560px;margin:14px auto;text-align:left}
.qo{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#0a1030;font-size:18px}
.qo b{color:var(--a);margin-right:8px}
.qo.ok{border-color:var(--ok);background:rgba(61,220,151,.15)}
 
.modal .card.big{max-width:1100px;max-height:94vh;overflow:auto}
.cg{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.cg{grid-template-columns:1fr}}
#cert,#cert2{container-type:inline-size;aspect-ratio:297/210;width:100%;padding:2%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#cert2{max-width:900px;margin:0 auto}
#cert .ci,#cert2 .ci{height:100%;padding:1.2cqw}
#cert .ci2,#cert2 .ci2{height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:3cqw 4cqw}
#cf label{display:block}
#cf input[type=color]{height:40px;padding:2px}
@media print{@page{size:A4 landscape;margin:0}body *{visibility:hidden}#cert,#cert *,#cert2,#cert2 *{visibility:visible}#cert,#cert2{max-width:none;margin:0;position:fixed;left:0;top:0;width:297mm;height:210mm;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
 
.emo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.emo .pn{display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.emo.open .pn{display:grid}
.emo .pn button{background:transparent;padding:6px;font-size:28px;border-radius:10px;line-height:1}
.emo .pn button:hover{background:rgba(255,255,255,.1);box-shadow:none}
.emo .tg{width:54px;height:54px;border-radius:50%;padding:0;font-size:28px}
.fly{position:fixed;bottom:90px;pointer-events:none;z-index:30;font-size:44px;animation:fl 2.2s ease-out forwards}
@keyframes fl{to{transform:translateY(-65vh) scale(1.6);opacity:0}}
@media print{.emo{display:none}}
a.fin{text-decoration:none;font-weight:700;border-radius:12px;padding:8px 14px;font-size:13px;color:#06102b;background:linear-gradient(90deg,var(--g),var(--a));display:inline-block;transition:transform .15s,box-shadow .15s}
a.fin:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,200,87,.3)}
 
/* ---- natijalar (admin) ---- */
.rt{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;background:#0a1030}
.rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rh small,.mut{color:var(--mut)}
.rr{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden;background:rgba(14,21,56,.9)}
.rr .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(0,224,255,.22),rgba(139,92,246,.12));z-index:0;transition:width .5s}
.rr>*:not(.bar){position:relative;z-index:1}
.rr .pl{min-width:46px;text-align:center;font-weight:800;font-size:20px;color:var(--mut)}
.rr .pl.md{font-size:30px}
.rr .inf{flex:1;min-width:0}
.rr .inf b{display:block;overflow-wrap:anywhere}
.rr .inf small{color:var(--mut);display:block;overflow-wrap:anywhere}
.rr .pt{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.rr.p1{border-color:var(--g);box-shadow:0 0 22px rgba(255,200,87,.18)}
.rr.p2{border-color:#c0c8e0}
.rr.p3{border-color:#d08b52}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo"><span>Flex.io</span>/zakovat</div>
 <div class="row"><a class="fin" id="finbtn" href="../index.html">🏅 Flex finalists</a><div id="topbtn"></div></div>
</header>
 
<!-- ADMIN PANEL -->
<section id="dash" class="hide">
 <h2>Testlarni boshqarish</h2>
 <div class="card">
  <h3 style="margin-top:0">Yangi test yaratish</h3>
  <div class="row">
   <div style="flex:2;min-width:160px"><label>Test nomi</label><input id="tn" placeholder="Masalan: 1-test"></div>
   <div style="flex:1;min-width:140px"><label>Test paroli</label><input id="tc" placeholder="Bo’sh = avtomatik"></div>
  </div>
  <button onclick="addTest()">Test yaratish</button>
 </div>
 <div class="card">
  <h3 style="margin-top:0">Testlarim (<span id="tcnt">0</span>)</h3>
  <div id="tlist"></div>
 </div>
 <div class="card hide" id="rescard">
  <h3 style="margin-top:0">📊 Natijalar: <span id="rtitle" style="color:var(--a)"></span></h3>
  <div id="reslist"></div>
 </div>
 <div class="card hide" id="qpanel">
  <h3 style="margin-top:0">Savollar: <span id="qtitle" style="color:var(--a)"></span></h3>
  <label>Savol matni</label>
  <textarea id="qt" rows="3" placeholder="Savolni yozing..."></textarea>
  <label>Savol turi</label>
  <select id="qk" onchange="kindUI()"><option value="w">Yozma ish (ochiq javob)</option><option value="t">Test (variantlar)</option></select>
  <div id="opts" class="hide">
   <label>Variantlar (kamida 2 ta)</label>
   <input id="o0" placeholder="A variant"><input id="o1" placeholder="B variant">
   <input id="o2" placeholder="C variant (ixtiyoriy)"><input id="o3" placeholder="D variant (ixtiyoriy)">
   <label>To’g’ri variant</label>
   <select id="qc"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
  </div>
  <div class="row">
   <div id="wans" style="flex:2;min-width:160px"><label>Javob</label><input id="qa" placeholder="To’g’ri javob"></div>
   <div style="flex:1;min-width:100px"><label>Vaqt (soniya)</label><input id="qs" type="number" value="60" min="5"></div>
  </div>
  <button onclick="addQ()">Savol qo’shish</button>
  <div id="qlist"></div>
 </div>
 <div style="text-align:center"><button class="ghost sm" onclick="logout()">Chiqish</button></div>
</section>
 
<!-- PUBLIC PAGE -->
<section id="home">
 <div class="hero">
  <h1>Aqlingni <span>sina</span>,<br>zakovatda yut!</h1>
  <p>Test parolini kiriting va zakovatni boshlang.</p>
  <div class="row" style="justify-content:center">
   <button onclick="document.getElementById('join').scrollIntoView()">Parol kiritish ↓</button>
   <button class="ghost" onclick="openLogin()">Akkauntga kirish</button>
  </div>
 </div>
 
 <div id="join">
  <div class="card">
   <h2 style="margin-top:0">Zakovat parolini kiriting</h2>
   <input id="jc" placeholder="PAROL" onkeydown="if(event.key==='Enter')join()">
   <div class="err" id="jerr"></div>
   <button onclick="join()">Testni ochish</button>
  </div>
 </div>
 
 <div id="game" class="hide">
  <div class="card">
   <div class="row" style="justify-content:space-between">
    <h2 style="margin:0" id="gtitle"></h2>
    <button class="ghost sm" onclick="leave()">Testni yopish</button>
   </div>
  </div>
 
  <div class="card">
   <h3 style="margin-top:0">Jamoalar</h3>
   <div class="row">
    <div style="width:150px"><label>Jamoalar soni</label><input id="tcount" type="number" min="1" max="30" value="4" style="margin:6px 0"></div>
    <button onclick="makeTeams()" style="margin-top:20px">Jamoalarni yaratish</button>
    <button class="ghost" onclick="resetScores()" style="margin-top:20px">Ballarni 0 qilish</button>
    <button class="plus" onclick="openCert(-1)" style="margin-top:20px">🏆 G’olibga sertifikat</button>
   </div>
   <div class="teams" id="teams" style="margin-top:16px"></div>
  </div>
 
  <div class="card hide" id="icard"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">🏆 Sertifikat</h3><div class="row"><button class="sm" onclick="window.print()">Chop etish / PDF</button><button class="ghost sm" onclick="$('icard').classList.add('hide')">Yopish</button></div></div><div id="cert2"></div></div>
  <div class="emo" id="emo"><div class="pn" id="epn"></div><button class="tg" onclick="$('emo').classList.toggle('open')" title="Emotsiyalar">😊</button></div>
  <div class="card qbox">
   <div class="n" id="qn"></div>
   <div class="t" id="qtext"></div>
   <div class="qopts hide" id="qopt"></div>
   <div class="timer" id="timer"></div>
   <div class="ans" id="ans"></div>
   <div class="row" style="justify-content:center;margin-top:14px">
    <button class="ghost" onclick="step(-1)">← Oldingi</button>
    <button onclick="startTimer()">Vaqtni boshlash</button>
    <button class="ghost" onclick="showAns()">Javobni ko’rsatish</button>
    <button class="ghost" onclick="step(1)">Keyingi →</button>
   </div>
  </div>
 </div>
</div>
</div>
 
<div class="modal" id="modal">
 <div class="card">
  <h2 style="margin-top:0">Akkauntga kirish</h2>
  <label>Login</label>
  <input id="lg" autocomplete="username" placeholder="Login">
  <label>Parol</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Parol" onkeydown="if(event.key==='Enter')login()">
  <div class="err" id="err"></div>
  <div class="row"><button onclick="login()">Kirish</button><button class="ghost" onclick="closeLogin()">Bekor qilish</button></div>
 </div>
</div>
 
<div class="modal" id="cm">
 <div class="card big">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
   <h2 style="margin:0">🏆 Sertifikat</h2>
   <div class="row"><button class="sm" onclick="window.print()">Chop etish / PDF</button><button class="ghost sm" onclick="resetCert()">Standartga qaytarish</button><button class="ghost sm" onclick="$('cm').classList.remove('open')">Yopish</button></div>
  </div>
  <div class="cg"><div id="cert"></div><div id="cf"></div></div>
 </div>
</div>
 
<script>
var LOGIN="farodis.flex.io",PASS="03112011";
var SB_URL="SHU_YERGA_SUPABASE_URL",SB_KEY="SHU_YERGA_ANON_KEY";
var mem={},timers={};
var H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};
function sg(k,d){try{var v=localStorage.getItem(k);return v===null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}}
function push(k,v){
 clearTimeout(timers[k]);
 timers[k]=setTimeout(function(){
  fetch(SB_URL+"/rest/v1/kv",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},body:JSON.stringify({key:k,value:v})}).catch(function(){})
 },400)
}
function ss(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(k!=="zk_in")push(k,v)}
async function pull(){
 try{
  var r=await fetch(SB_URL+"/rest/v1/kv?select=key,value",{headers:H});
  if(!r.ok)return;
  var rows=await r.json();
  rows.forEach(function(x){mem[x.key]=x.value;try{localStorage.setItem(x.key,JSON.stringify(x.value))}catch(e){}});
  tests=sg("zk_tests",[]);
 }catch(e){}
}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tests=sg("zk_tests",[]),selId=null,cur=null,teams=[],qi=0,tm=null;
var L=["A","B","C","D"];
 
/* ---- login / admin ---- */
function openLogin(){$("modal").classList.add("open");$("err").textContent="";$("lg").focus()}
function closeLogin(){$("modal").classList.remove("open")}
function login(){
 if($("lg").value.trim()===LOGIN&&$("pw").value===PASS){ss("zk_in",true);closeLogin();$("pw").value="";show()}
 else $("err").textContent="Login yoki parol noto’g’ri!"
}
function logout(){ss("zk_in",false);show()}
function show(){
 var on=sg("zk_in",false);
 $("home").classList.toggle("hide",on);$("dash").classList.toggle("hide",!on);
 $("topbtn").innerHTML=on?'<span style="color:var(--mut)">'+LOGIN+'</span>':'<button class="ghost sm" onclick="openLogin()">Akkauntga kirish</button>';
 if(on)renderAdmin()
}
function genCode(){var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function addTest(){
 var n=$("tn").value.trim()||("Test "+(tests.length+1)),c=($("tc").value.trim()||genCode()).toUpperCase();
 if(tests.some(function(t){return t.code===c})){alert("Bu parol band, boshqasini tanlang.");return}
 var t={id:"t"+Date.now(),name:n,code:c,qs:[]};tests.push(t);ss("zk_tests",tests);
 $("tn").value="";$("tc").value="";selId=t.id;renderAdmin()
}
function selTest(id){selId=id;renderAdmin()}
var pd=null,pdt;
function delTest(id){
 if(pd!==id){pd=id;clearTimeout(pdt);pdt=setTimeout(function(){pd=null;renderAdmin()},4000);renderAdmin();return}
 clearTimeout(pdt);pd=null;tests=tests.filter(function(t){return t.id!==id});ss("zk_tests",tests);if(selId===id)selId=null;renderAdmin()
}
function sel(){return tests.filter(function(t){return t.id===selId})[0]}
function kindUI(){
 var t=$("qk").value==="t";
 $("opts").classList.toggle("hide",!t);
 $("wans").classList.toggle("hide",t)
}
function addQ(){
 var t=sel(),q=$("qt").value.trim(),a=$("qa").value.trim(),s=parseInt($("qs").value)||60,k=$("qk").value;
 if(!t||!q)return;
 if(k==="t"){
  var cc=parseInt($("qc").value),o=[],c=-1;
  [0,1,2,3].forEach(function(i){var v=$("o"+i).value.trim();if(v){if(i===cc)c=o.length;o.push(v)}});
  if(o.length<2){alert("Kamida 2 ta variant kiriting.");return}
  if(c<0){alert("To’g’ri variant bo’sh bo’lmasligi kerak.");return}
  t.qs.push({k:"t",t:q,o:o,c:c,a:o[c],s:s});
  [0,1,2,3].forEach(function(i){$("o"+i).value=""})
 }else{
  if(!a)return;
  t.qs.push({k:"w",t:q,a:a,s:s})
 }
 ss("zk_tests",tests);$("qt").value="";$("qa").value="";renderAdmin()
}
function delQ(i){sel().qs.splice(i,1);ss("zk_tests",tests);renderAdmin()}
function renderAdmin(){
 $("tcnt").textContent=tests.length;
 $("tlist").innerHTML=tests.length?tests.map(function(t){return '<div class="item'+(t.id===selId?' sel':'')+'" style="cursor:pointer" onclick="selTest(\''+t.id+'\')"><div><b>'+esc(t.name)+'</b><br><small>Parol: <span class="code">'+esc(t.code)+'</span> · '+t.qs.length+' ta savol</small></div><div class="row"><button class="ghost sm" onclick="event.stopPropagation();selTest(\''+t.id+'\')">Savollar</button><button class="ghost sm" onclick="event.stopPropagation();delTest(\''+t.id+'\')"'+(pd===t.id?' style="border-color:var(--err);color:var(--err)">Ha, o’chirish':'>O’chirish')+'</button></div></div>'}).join(""):'<small style="color:var(--mut)">Hozircha test yo’q.</small>';
 var t=sel();$("qpanel").classList.toggle("hide",!t);
 if(t){$("qtitle").textContent=t.name;
  $("qlist").innerHTML=t.qs.map(function(q,i){return '<div class="item"><div><b style="color:var(--a)">'+(i+1)+'.</b> '+esc(q.t)+'<span class="tag'+(q.k==="t"?' t':'')+'">'+(q.k==="t"?'TEST':'YOZMA')+'</span><br>'+(q.k==="t"?q.o.map(function(x,j){return '<small>'+L[j]+') '+esc(x)+(j===q.c?' ✔':'')+'</small>'}).join('<br>')+'<br>':'')+'<small>Javob: '+esc(q.a)+' · '+q.s+' soniya</small></div><button class="ghost sm" onclick="delQ('+i+')">O’chirish</button></div>'}).join("")}
 renderResults()
}
 
/* ---- natijalar (admin) ---- */
function renderResults(){
 var el=$("reslist"),t=sel();if(!el)return;
 $("rescard").classList.toggle("hide",!t);
 if(!t){el.innerHTML="";return}
 $("rtitle").textContent=t.name;
 var MD=["🥇","🥈","🥉"],tt=sg("zk_teams_"+t.id,[]);
 var h='<div class="rh"><small>Parol: <span class="code">'+esc(t.code)+'</span> · '+tt.length+' ta jamoa</small></div>';
 if(!tt.length){el.innerHTML=h+'<small class="mut">Bu test bo’yicha hali natija yo’q.</small>';return}
 var r=tt.map(function(x,i){return {n:x.n,s:x.s,m:x.m||"",i:i}}).sort(function(a,b){return b.s-a.s||a.i-b.i});
 var mx=Math.max.apply(null,r.map(function(x){return x.s})),p=0;
 r.forEach(function(x,i){
  if(i===0||x.s!==r[i-1].s)p=i+1;
  var w=mx>0?Math.max(0,x.s)/mx*100:0;
  h+='<div class="rr'+(p<=3?' p'+p:'')+'"><div class="bar" style="width:'+w+'%"></div>'
   +'<div class="pl'+(p<=3?' md':'')+'">'+(p<=3?MD[p-1]:p+'-o’rin')+'</div>'
   +'<div class="inf"><b>'+esc(x.n)+'</b>'+(x.m.trim()?'<small>'+esc(x.m.replace(/\n+/g,", "))+'</small>':'')+'</div>'
   +'<div class="pt">'+x.s+'</div></div>'
 });
 el.innerHTML=h
}
 
/* ---- public: open test by password ---- */
async function join(){
 await pull();
 var c=$("jc").value.trim().toUpperCase();
 var t=tests.filter(function(x){return x.code===c})[0];
 if(!t){$("jerr").textContent="Bunday parolli test topilmadi!";return}
 $("jerr").textContent="";cur=t;qi=0;teams=sg("zk_teams_"+t.id,[]);
 $("gtitle").textContent=t.name;$("game").classList.remove("hide");
 renderTeams();renderQ();$("game").scrollIntoView()
}
function leave(){clearInterval(tm);cur=null;$("game").classList.add("hide");$("jc").value="";$("join").scrollIntoView()}
function saveTeams(){ss("zk_teams_"+cur.id,teams)}
function makeTeams(){
 var n=Math.max(1,Math.min(30,parseInt($("tcount").value)||1));
 teams=[];for(var i=1;i<=n;i++)teams.push({n:"Jamoa "+i,s:0,m:""});
 saveTeams();renderTeams()
}
function pt(i,d){teams[i].s+=d;saveTeams();renderTeams()}
function setTeam(i,k,v){teams[i][k]=v;saveTeams()}
function resetScores(){teams.forEach(function(t){t.s=0});saveTeams();renderTeams()}
function renderTeams(){
 $("teams").innerHTML=teams.length?teams.map(function(t,i){return '<div class="team"><input value="'+esc(t.n)+'" oninput="setTeam('+i+',\'n\',this.value)" placeholder="Jamoa nomi"><div class="sc">'+t.s+'</div><div class="row"><button class="minus" onclick="pt('+i+',-1)">−1</button><button class="plus" onclick="pt('+i+',1)">+1</button></div><textarea rows="3" oninput="setTeam('+i+',\'m\',this.value)" placeholder="Jamoa a’zolari ismlari...">'+esc(t.m||"")+'</textarea><button class="ghost sm" style="margin-top:8px" onclick="openInline('+i+')">🏆 Sertifikat</button></div>'}).join(""):'<small style="color:var(--mut)">Jamoalar sonini kiriting va yarating.</small>'
}
function renderQ(){
 clearInterval(tm);$("timer").textContent="";$("ans").textContent="";
 var q=cur.qs[qi],ob=$("qopt");ob.classList.add("hide");ob.innerHTML="";
 if(!q){$("qn").textContent="";$("qtext").textContent="Bu testda savollar yo’q.";return}
 $("qn").textContent="Savol "+(qi+1)+" / "+cur.qs.length+" · "+(q.k==="t"?"Test":"Yozma ish");
 $("qtext").textContent=q.t;$("timer").textContent=q.s;
 if(q.k==="t"){
  ob.innerHTML=q.o.map(function(x,j){return '<div class="qo"><b>'+L[j]+')</b>'+esc(x)+'</div>'}).join("");
  ob.classList.remove("hide")
 }
}
function step(d){var n=qi+d;if(n<0||n>=cur.qs.length)return;qi=n;renderQ()}
function showAns(){
 var q=cur.qs[qi];if(!q)return;
 if(q.k==="t"){
  $("ans").textContent="Javob: "+L[q.c]+") "+q.a;
  var el=$("qopt").children;if(el[q.c])el[q.c].classList.add("ok")
 }else $("ans").textContent="Javob: "+q.a
}
function startTimer(){
 var q=cur.qs[qi];if(!q)return;clearInterval(tm);var s=q.s;$("timer").textContent=s;
 tm=setInterval(function(){s--;$("timer").textContent=s;if(s<=0){clearInterval(tm);$("timer").textContent="Vaqt tugadi!"}},1000)
}
 
/* ---- sertifikat ---- */
var CF=[["title","Sarlavha","text"],["sub","Kichik matn","text"],["place","O’rin / unvon","text"],["tn","Jamoa nomi","text"],["mem","Ishtirokchilar (har biri yangi qatorda)","area"],["body","Asosiy matn","area"],["date","Sana","text"],["signer","Imzo egasi","text"],["role","Lavozimi","text"],["bg","Orqa fon rangi","color"],["bd","Hoshiya rangi","color"],["ac","Sarlavha rangi","color"],["tx","Matn rangi","color"],["bdw","Hoshiya qalinligi (1–10)","num"],["font","Shrift","font"]];
var FONTS=[["Georgia,serif","Georgia (klassik)"],["'Segoe UI',Arial,sans-serif","Segoe UI (zamonaviy)"],["'Times New Roman',serif","Times New Roman"],["'Brush Script MT',cursive","Qo’lyozma"],["Impact,sans-serif","Qalin (Impact)"]];
var CD={title:"SERTIFIKAT",sub:"Ushbu sertifikat quyidagi jamoaga topshiriladi",place:"1-o’rin sohibi",body:"Zakovat o’yinida ko’rsatgan yuksak bilim va g’alabasi uchun taqdirlanadi.",date:new Date().toLocaleDateString("en-GB"),signer:"Farodis",role:"Tashkilotchi",bg:"#fffaf0",bd:"#c9a227",ac:"#8b5cf6",tx:"#222244",bdw:6,font:"Georgia,serif"};
var cs=Object.assign({tn:"",mem:""},CD,sg("zk_cert",{}));
function saveCert(){var o={};for(var k in cs)if(k!=="tn"&&k!=="mem")o[k]=cs[k];ss("zk_cert",o)}
function openCert(i){
 if(!cur||!teams.length){alert("Avval jamoalarni yarating.");return}
 if(i<0){i=0;teams.forEach(function(t,j){if(t.s>teams[i].s)i=j})}
 cs.tn=teams[i].n;cs.mem=teams[i].m||"";
 renderCF();drawCert();$("icard").classList.add("hide");$("cm").classList.add("open")
}
function cf(k,v){cs[k]=k==="bdw"?(parseFloat(v)||1):v;if(k!=="tn"&&k!=="mem")saveCert();drawCert()}
function resetCert(){cs=Object.assign({},CD,{tn:cs.tn,mem:cs.mem});saveCert();renderCF();drawCert()}
function renderCF(){
 $("cf").innerHTML=CF.map(function(f){
  var k=f[0],v=cs[k],h='<label>'+f[1]+'</label>';
  if(f[2]==="area")return h+'<textarea rows="4" oninput="cf(\''+k+'\',this.value)">'+esc(v)+'</textarea>';
  if(f[2]==="font")return h+'<select oninput="cf(\'font\',this.value)" style="width:100%;padding:12px;margin:6px 0 14px;border-radius:10px;background:#080d2b;color:var(--tx);border:1px solid var(--line)">'+FONTS.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===v?' selected':'')+'>'+x[1]+'</option>'}).join("")+'</select>';
  return h+'<input type="'+(f[2]==="num"?"number\" min=\"1\" max=\"10":f[2])+'" value="'+esc(v)+'" oninput="cf(\''+k+'\',this.value)">'
 }).join("")
}
function drawCert(id){var E=$(id||"cert");
 var m=cs.mem.split("\n").map(function(x){return x.trim()}).filter(Boolean);
 E.style.cssText="background:"+cs.bg+";color:"+cs.tx+";font-family:"+cs.font;
 E.innerHTML='<div class="ci" style="border:'+(cs.bdw*0.4)+'cqw solid '+cs.bd+'"><div class="ci2" style="border:0.25cqw solid '+cs.ac+'">'
 +'<div><div style="font-size:6.5cqw;font-weight:800;letter-spacing:.6cqw;color:'+cs.ac+'">'+esc(cs.title)+'</div>'
 +'<div style="font-size:1.9cqw;margin-top:1cqw">'+esc(cs.sub)+'</div></div>'
 +'<div><div style="font-size:2.4cqw;color:'+cs.bd+';font-weight:700">'+esc(cs.place)+'</div>'
 +'<div style="font-size:5.5cqw;font-weight:800;margin:.8cqw 0">'+esc(cs.tn)+'</div>'
 +'<div style="font-size:2cqw;display:flex;flex-wrap:wrap;gap:.5cqw 2cqw;justify-content:center">'+m.map(function(x){return '<span>'+esc(x)+'</span>'}).join("")+'</div></div>'
 +'<div style="font-size:2.1cqw;max-width:75%">'+esc(cs.body)+'</div>'
 +'<div style="display:flex;justify-content:space-between;width:100%;font-size:1.8cqw;align-items:flex-end"><div>'+esc(cs.date)+'</div><div><div style="font-weight:700;font-size:2.2cqw;border-top:.2cqw solid '+cs.tx+';padding-top:.5cqw;min-width:20cqw">'+esc(cs.signer)+'</div>'+esc(cs.role)+'</div></div>'
 +'</div></div>'
}
 
 
function openInline(i){
 if(!cur||!teams.length)return;
 cs.tn=teams[i].n;cs.mem=teams[i].m||"";
 $("cm").classList.remove("open");$("icard").classList.remove("hide");
 drawCert("cert2");$("icard").scrollIntoView({behavior:"smooth"})
}
